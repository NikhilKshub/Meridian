<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="boot-screen" id="boot-screen">
    <div class="boot-topcorner">
      <div class="boot-day" id="boot-day">---</div>
      <div class="boot-date" id="boot-date">--- --</div>
      <div class="boot-time" id="boot-time">--:--</div>
    </div>
    <div class="boot-center">
      <div class="boot-line" id="boot-line"></div>
      <div class="boot-wordmark" id="boot-wordmark">MERIDIAN</div>
      <div class="boot-tagline">a web desktop</div>
      <button class="boot-signin" id="boot-signin">Enter</button>
    </div>
    <div class="boot-quote" id="boot-quote"></div>
  </div>

  <header class="status-bar">
    <span class="status-item">MERIDIAN</span>
    <span class="status-dot"></span>
    <span class="status-item" id="status-date">--- --</span>
    <span class="status-fill"></span>
    <span class="status-item" id="status-time">--:--</span>
  </header>
  <main class="desktop" id="desktop">
  <div class="dock-trigger" id="dock-trigger"></div>    
    <nav class="dock" id="app-grid">
      <button class="app-tile accent-green" data-app="notes">
        <span class="app-icon-chip"><svg class="app-icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="1"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg></span>
        <span>Notes</span>
      </button>
      <button class="app-tile" data-app="calculator">
        <span class="app-icon-chip"><svg class="app-icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="1"/><line x1="8" y1="7" x2="16" y2="7"/><circle cx="8.5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="15.5" cy="12" r="1"/><circle cx="8.5" cy="16" r="1"/><circle cx="12" cy="16" r="1"/><circle cx="15.5" cy="16" r="1"/></svg></span>
        <span>Calculator</span>
      </button>
      <button class="app-tile" data-app="pomodoro">
        <span class="app-icon-chip"><svg class="app-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg></span>
        <span>Pomodoro</span>
      </button>
      <button class="app-tile accent-amber" data-app="terminal">
        <span class="app-icon-chip"><svg class="app-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M7 9l3 3-3 3"/><path d="M12 15h5"/></svg></span>
        <span>Terminal</span>
      </button>
      <button class="app-tile accent-amber" data-app="music">
        <span class="app-icon-chip"><svg class="app-icon" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="18" r="2.5"/><circle cx="18" cy="16" r="2.5"/><path d="M11.5 18V5.5L20.5 4v11.5"/></svg></span>
        <span>Music</span>
      </button>
      <button class="app-tile" data-app="paint">
        <span class="app-icon-chip"><svg class="app-icon" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.3-.5-.8-.5-1.2 0-1.1.9-2 2-2h2a4 4 0 0 0 4-4c0-4.4-4-7.5-9-7.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="8" r="1"/></svg></span>
        <span>Paint</span>
      </button>
      <button class="app-tile accent-green" data-app="snake">
        <span class="app-icon-chip"><svg class="app-icon" viewBox="0 0 24 24" fill="none"><path d="M4 8c0-2 1.5-3 3-3s3 1 3 3-1.5 3-3 3H6c-2 0-3 1.5-3 3s1.5 3 3 3h11c2 0 3-1.5 3-3"/><circle cx="18" cy="17" r="1.2"/></svg></span>
        <span>Snake</span>
      </button>
    </nav>
    <div class="left-stack">
      <div class="widget widget-sundial" id="sundial-widget">
        <svg class="sundial" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" class="sundial-face"/>
          <circle cx="50" cy="50" r="2.5" class="sundial-pin"/>
          <line x1="50" y1="50" x2="50" y2="20" class="sundial-hand-hour" id="sundial-hour"/>
          <line x1="50" y1="50" x2="50" y2="12" class="sundial-hand-min" id="sundial-minute"/>
        </svg>
        <div class="sundial-label">local time</div>
      </div>
      <div class="widget widget-quote-card">
        <div class="widget-label">Today's Quote</div>
        <div class="desktop-quote" id="desktop-quote"></div>
      </div>
    </div>
    <aside class="widget-panel">
      <div class="widget widget-green" id="todo-widget">
        <div class="widget-label">Tasks</div>
        <div class="todo-input-row">
          <input type="text" class="todo-input" id="todo-input" placeholder="Add a task..." />
          <button class="todo-add" id="todo-add">+</button>
        </div>
        <div class="todo-list" id="todo-list"></div>
      </div>

      <div class="widget widget-blue" id="hydration-widget">
        <div class="widget-label">Hydration</div>
        <div class="hydration-count" id="hydration-count">0 / 8 cups</div>
        <div class="hydration-bar"><div class="hydration-bar-fill" id="hydration-bar-fill"></div></div>
        <div class="hydration-controls">
          <button class="hydration-btn" id="hydration-minus">-</button>
          <button class="hydration-btn hydration-plus" id="hydration-plus">+ Cup</button>
        </div>
      </div>
    </aside>
    <div class="now-playing" id="now-playing">
      <div class="now-playing-icon">&#9835;</div>
      <div class="now-playing-info">
        <div class="now-playing-title" id="now-playing-title">—</div>
        <div class="now-playing-sub" id="now-playing-sub">Paused</div>
      </div>
    </div>
  </main>

  <div class="context-menu" id="context-menu">
    <button data-action="refresh">Refresh</button>
    <button data-action="arrange">Arrange Windows</button>
    <button data-action="wallpaper">Replace Wallpaper</button>
  </div>
  <input type="file" id="wallpaper-input" accept="image/*" hidden />
<script src="script.js"></script>
</body>
</html>
