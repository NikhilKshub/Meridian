<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=IBM+Plex+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topbar">
    <h1>Meridian</h1>
    <time class="clock"></time>
  </header>
  <main class="desk">
    <ul class="icons">
      <li>
        <button data-window="doodle">
          <img src="assets/doodleicon.png" alt="doodle app">
          <span class="label">Doodle</span>
        </button>
      </li>
      <li>
        <button data-window="notes">
          <img src="assets/notes.png" alt="notes app">
          <span class="label">Notes</span>
        </button>
      </li>
      <li>
        <button data-window="mood">
          <img src="assets/smile.png" alt="Mood tracker app">
          <span class="label">Mood</span>
        </button>
      </li>
      <li>
        <button data-window="music">
          <img src="assets/music.png" alt="Music app">
          <span class="label">Music</span>
        </button>
      </li>
    </ul>

    <section class="window hidden" id="doodle">
      <header class="titlebar">
        <h2>Doodle</h2>
        <button aria-label="Close">×</button>
      </header>
      <div class="window-body">
        <p>Draw something that comes to mind.</p>
        <canvas width="338" height="240"></canvas>
        <div class="tools">
          <button id="undo">Undo</button>
          <button id="clear">Clear</button>
        </div>
      </div>
    </section>

    <section class="window hidden" id="notes">
      <header class="titlebar">
        <h2>Notes</h2>
        <button aria-label="Close">×</button>
      </header>
      <div class="window-body">
        <p>Write something down.</p>
        <textarea aria-label="Notes"></textarea>
      </div>
    </section>

    <section class="window hidden" id="mood">
      <header class="titlebar">
        <h2>Mood</h2>
        <button aria-label="Close">×</button>
      </header>
      <div class="window-body">
        <p>How's your mood today?</p>

        <div id="days"></div>
        <div class="tools hidden" id="moods"></div>
      </div>
      <div class="note window-body hidden">
        <p id="note-title"></p>
        <textarea id="note-text" placeholder="How did your day go?" aria-label="Day note"></textarea>
      </div>
    </section>

    <section class="window-hidden" id="music">
      <header class="titlebar">
        <h2>Music</h2>
        <button aria-label="Close">×</button>
      </header>
      <div class="window-body">
        <p>A little soundtrack for the moment.</p>
        <div class="player">
          <ul id="tracks"></ul>
          <div class="deck">
            <div class="disc"></div>
            <h3 id="track-title"></h3>
            <span id="track-artist"></span>
            <div class="bar">
              <div class="fill"></div>
            </div>
            <span id="time"></span>
            <div class="controls">
              <button id="prev">PREV</button>
              <button id="play">PLAY</button>
              <button id="next">NEXT</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="widget">
      <h2>Water</h2>
      <p><span id="count">0</span> of 8 glasses</p>
      <div class="bar">
        <div class="fill"></div>
      </div>
      <button id="drink">Drink</button>
      <button id="reset">Reset</button>
    </aside>
  </main>

  <!-- WEBOS2.0 STARTING FROM HERE -->

  <script src="script.js"></script>
</body>
</html>
