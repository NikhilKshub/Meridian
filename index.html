<!DOCTYPE html>
<html lang="en">
<head>
  <title>Meridian</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="status-bar">
    <span>MERIDIAN</span>
    <div class="status-right">
      <span id="status-date">SEP 22</span>
      <span id="status-time">14:36</span>
    </div>
  </header>

  <button class="icon" data-app="notes">
    <div class="icon-glyph">
      <svg viewBox="0 0 24 24" width="28" height="28">
        <rect x="4" y="3" width="16" height="18" fill="none" stroke="black" stroke-width="1.5"/>
        <line x1="7" y1="8" x2="17" y2="8" stroke="black" stroke-width="1.5"/>
        <line x1="7" y1="12" x2="17" y2="12" stroke="black" stroke-width="1.5"/>
      </svg>
    </div>
    <span class="icon-label">Notes</span>
  </button>
  <div class="window" id="window-notes" style="display: none;">
    <div class="window-titlebar">
      <span>Notes</span>
      <button class="window-close">×</button>
    </div>
    <div class="window-body">
      <textarea id="notes-text" placeholder="Type here..." style="width: 100%; height: 150px; border: 1px solid var(--border); font-family: inherit;"></textarea>
    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
