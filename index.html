<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="rail">
    <h1>Meridian</h1>
    <ul>
      <li>
        <button data-window="about">
          <span>1</span>
          About
        </button>
      </li>
      <li>
        <button data-window="notes">
          <span>2</span>
          Notes
        </button>
      </li>
    </ul>
    <ul id="open-list"></ul>
  </nav>

  <main class="desk">
    <section class="window" id="about">
      <header class="titlebar">
        <h2>About</h2>
        <button aria-label="Close">×</button>
      </header>
      <div class="window-body">
        <p>This is a placeholder.</p>
      </div>
    </section>
    <section class="window" id="notes">
      <header class="titlebar">
        <h2>Notes</h2>
        <button aria-label="Close">×</button>
      </header>
      <div class="window-body">
        <p>This is the notes window</p>
      </div>
    </section>
  </main>

</body>
</html>
