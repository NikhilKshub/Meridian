<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="boot-screen" id="boot-screen">
    <div class="boot-topcorner">
      <div class="boot-day" id="boot-day">---</div>
      <div class="boot-date" id="boot-date">--- --</div>
      <div class="boot-time" id="boot-time">--:--</div>
    </div>
    <div class="boot-center">
      <div class="boot-line" id="boot-line"></div>
      <div class="boot-wordmark" id="boot-wordmark">MERIDIAN</div>
      <button class="boot-signin" id="boot-signin">Enter</button>
    </div>
    <div class="boot-quote" id="boot-quote"></div>
  </div>

  <header class="status-bar">
    <span class="status-item">MERIDIAN</span>
    <span class="status-dot"></span>
    <span class="status-item" id="status-date">--- --</span>
    <span class="status-fill"></span>
    <span class="status-item" id="status-time">--:--</span>
  </header>
  <main class="desktop" id="desktop">
  <div class="dock-trigger" id="dock-trigger"></div>
    <nav class="dock" id="app-grid">
      <button class="app-tile accent-green" data-app="notes">
        <span class="app-icon-chip"><svg class="app-icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="1"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg></span>
        <span>Notes</span>
      </button>
      <button class="app-tile" data-app="calculator">
        <span class="app-icon-chip"><svg class="app-icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="1"/><line x1="8" y1="7" x2="16" y2="7"/><circle cx="8.5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="15.5" cy="12" r="1"/><circle cx="8.5" cy="16" r="1"/><circle cx="12" cy="16" r="1"/><circle cx="15.5" cy="16" r="1"/></svg></span>
        <span>Calculator</span>
      </button>
    </nav>
    <aside class="widget-panel">
      <div class="widget widget-quote-card">
        <div class="widget-label">Today's Quote</div>
        <div class="desktop-quote" id="desktop-quote"></div>
      </div>
    </aside>
  </main>
<script src="script.js"></script>
</body>
</html>
